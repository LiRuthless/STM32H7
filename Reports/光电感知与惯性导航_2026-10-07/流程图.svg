<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img"><title>光电与惯性导航算法关系图</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#356780"/></marker></defs><rect width="1080" height="580" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif" fill="#17394c"><rect x="30" y="25" width="1020" height="60" rx="9" fill="#eaf3fa" stroke="#6c96b0"/><text x="540.0" y="60.0" text-anchor="middle" font-size="17"><tspan x="540.0" dy="0">同步采样及时间戳　ADC / GPIO / IMU / 编码器</tspan></text><path d="M280,85 L280,125" stroke="#356780" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,85 L800,125" stroke="#356780" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="125" width="500" height="65" rx="9" fill="#eaf3fa" stroke="#6c96b0"/><text x="280.0" y="162.5" text-anchor="middle" font-size="17"><tspan x="280.0" dy="0">光电极性标定 → 归一化 → 可选滤波</tspan></text><rect x="550" y="125" width="500" height="65" rx="9" fill="#eaf3fa" stroke="#6c96b0"/><text x="800.0" y="162.5" text-anchor="middle" font-size="17"><tspan x="800.0" dy="0">IMU 轴映射 / SI 单位 / 零偏标定</tspan></text><path d="M280,190 L280,230" stroke="#356780" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,190 L800,230" stroke="#356780" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="230" width="500" height="65" rx="9" fill="#eaf3fa" stroke="#6c96b0"/><text x="280.0" y="267.5" text-anchor="middle" font-size="17"><tspan x="280.0" dy="0">有效性检查 → 质心 或 左右差比和</tspan></text><rect x="550" y="230" width="500" height="65" rx="9" fill="#eaf3fa" stroke="#6c96b0"/><text x="800.0" y="257.5" text-anchor="middle" font-size="17"><tspan x="800.0" dy="0">姿态与重力补偿 → 纯 IMU 积分</tspan><tspan x="800.0" dy="23">或 编码器轮程＋陀螺角增量融合</tspan></text><path d="M280,295 L280,335" stroke="#356780" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,295 L800,335" stroke="#356780" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="335" width="500" height="70" rx="9" fill="#eaf3fa" stroke="#6c96b0"/><text x="280.0" y="365.0" text-anchor="middle" font-size="17"><tspan x="280.0" dy="0">正常偏差 → PID → 限幅 → 轮速指令</tspan><tspan x="280.0" dy="23">无效 / 丢线 → 复位 PID → 停止</tspan></text><rect x="550" y="335" width="500" height="70" rx="9" fill="#eaf3fa" stroke="#6c96b0"/><text x="800.0" y="365.0" text-anchor="middle" font-size="17"><tspan x="800.0" dy="0">有效状态 → 姿态 / 速度 / 位置</tspan><tspan x="800.0" dy="23">异常 → 状态标志 / 重新建立基线</tspan></text><path d="M280,405 L280,445" stroke="#356780" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,405 L800,445" stroke="#356780" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="445" width="1020" height="60" rx="9" fill="#e8f4eb" stroke="#6c96b0"/><text x="540.0" y="480.0" text-anchor="middle" font-size="17"><tspan x="540.0" dy="0">控制输出 + CSV 原始与结果记录 + JSON 上位机输出</tspan></text><text x="540" y="548" text-anchor="middle" font-size="16">下一周期继续；外部定位 / 可信静止观测按条件提供修正</text></g></svg>