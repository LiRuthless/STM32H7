<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#007E87" /></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><g id="title" data-pptx-bounds="56 40 1168 70"><text fill="#123252" font-weight="bold" font-size="42" text-anchor="start" x="56" y="92">可靠结果与实时数据，采用不同取舍</text></g><g id="claim" data-pptx-bounds="56 113 1168 42"><text fill="#007E87" font-weight="normal" font-size="30" text-anchor="start" x="56" y="145">传输 ACK 只表示接管；TELEMETRY 不做可靠重传</text></g><g id="main" data-pptx-bounds="56 160 1168 480"><rect x="56" y="215" width="1168" height="100" rx="0" fill="#123252" stroke="none" stroke-width="2" /><text fill="#FFFFFF" font-weight="bold" font-size="30" text-anchor="start" x="84" y="277">可靠业务：发送 → 等精确 ACK → 释放</text><text fill="#123252" font-weight="bold" font-size="30" text-anchor="start" x="56" y="390">200 ms 重发；最多 3 次</text><text fill="#AD551D" font-weight="bold" font-size="30" text-anchor="start" x="700" y="390">800 ms 无有效帧重握手</text><line x1="56" y1="433" x2="1224" y2="433" stroke="#CBD9E2" stroke-width="3" /><text fill="#007E87" font-weight="bold" font-size="30" text-anchor="start" x="56" y="498">等待 ACK 时仍可发送 TELEMETRY</text><text fill="#233647" font-weight="normal" font-size="30" text-anchor="start" x="56" y="565">传输 ACK ≠ 参数已生效 ≠ 已保存 Flash</text></g><g id="page-number" data-pptx-bounds="1160 650 64 40"><text fill="#52697B" font-weight="normal" font-size="24" text-anchor="end" x="1224" y="682">18</text></g></svg>