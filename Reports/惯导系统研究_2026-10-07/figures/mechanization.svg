<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="导航解算：比力不能直接当线加速度"><title>导航解算：比力不能直接当线加速度</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#416174"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif}.title{font-size:26px;font-weight:bold;fill:#163d52}.sub{font-size:17px;fill:#526b79}.box{font-size:19px;fill:#183d50}.note{font-size:17px;fill:#506873}.arrow{fill:none;stroke:#416174;stroke-width:2.5;marker-end:url(#arr)}</style><rect width="1000" height="620" fill="white"/><text class="title" x="500" y="35" text-anchor="middle">导航解算：比力不能直接当线加速度</text><text class="sub" x="500" y="67" text-anchor="middle">本图为局部三维捷联链路；严格平面时可用轮程约束平移</text><rect x="35" y="105" width="220" height="100" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="145.0" y="148.0" text-anchor="middle">原始数据 + 时间戳</text><text class="box" x="145.0" y="174.0" text-anchor="middle">量程 / 单位核验</text><rect x="390" y="105" width="220" height="100" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="500.0" y="148.0" text-anchor="middle">离线标定 + 在线bias</text><text class="box" x="500.0" y="174.0" text-anchor="middle">安装旋转到b系</text><rect x="745" y="105" width="220" height="100" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="855.0" y="148.0" text-anchor="middle">姿态更新 q_nb</text><text class="box" x="855.0" y="174.0" text-anchor="middle">角增量 / 中点旋转</text><rect x="745" y="295" width="220" height="100" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="855.0" y="338.0" text-anchor="middle">坐标变换 R_nb f_b</text><text class="box" x="855.0" y="364.0" text-anchor="middle">加 g_n 补偿重力</text><rect x="390" y="295" width="220" height="100" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="500.0" y="338.0" text-anchor="middle">速度积分</text><text class="box" x="500.0" y="364.0" text-anchor="middle">v_(k+1)=v_k+aΔt</text><rect x="35" y="295" width="220" height="100" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="145.0" y="338.0" text-anchor="middle">位置积分</text><text class="box" x="145.0" y="364.0" text-anchor="middle">p+=vΔt+½aΔt²</text><polyline class="arrow" points="255,155 390,155"/><polyline class="arrow" points="610,155 745,155"/><polyline class="arrow" points="855,205 855,295"/><polyline class="arrow" points="745,345 610,345"/><polyline class="arrow" points="390,345 255,345"/><rect x="35" y="475" width="400" height="85" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="235.0" y="510.5" text-anchor="middle">初值 q₀、v₀、p₀ 与协方差</text><text class="box" x="235.0" y="536.5" text-anchor="middle">静止：f_b≈(0,0,+g)，a_n≈0</text><rect x="555" y="475" width="410" height="85" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="760.0" y="510.5" text-anchor="middle">辅助更新 / 误差注入 / 诊断</text><text class="box" x="760.0" y="536.5" text-anchor="middle">不可观测时保留增长的不确定性</text><polyline class="arrow" points="235,475 235,440 145,440 145,395"/><polyline class="arrow" points="760,475 760,440 500,440 500,395"/><text class="note" x="500" y="600" text-anchor="middle">先对齐时间，再融合；被削顶或缺失的真实增量无法凭空恢复</text></svg>