<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="导航误差修正反馈：创新驱动状态与bias更新"><title>导航误差修正反馈：创新驱动状态与bias更新</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#416174"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif}.title{font-size:26px;font-weight:bold;fill:#163d52}.sub{font-size:17px;fill:#526b79}.box{font-size:19px;fill:#183d50}.note{font-size:17px;fill:#506873}.arrow{fill:none;stroke:#416174;stroke-width:2.5;marker-end:url(#arr)}</style><rect width="1000" height="620" fill="white"/><text class="title" x="500" y="35" text-anchor="middle">导航误差修正反馈：创新驱动状态与bias更新</text><text class="sub" x="500" y="67" text-anchor="middle">导航校正改变估计；运动控制改变真实车辆，两者职责不同</text><rect x="35" y="110" width="240" height="110" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="155.0" y="145.0" text-anchor="middle">校准后的IMU</text><text class="box" x="155.0" y="171.0" text-anchor="middle">扣除剩余bias</text><text class="box" x="155.0" y="197.0" text-anchor="middle">预测状态与P</text><rect x="390" y="110" width="240" height="110" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="510.0" y="158.0" text-anchor="middle">名义状态 x̂⁻、P⁻</text><text class="box" x="510.0" y="184.0" text-anchor="middle">预测观测 h(x̂⁻)</text><rect x="745" y="110" width="220" height="110" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="855.0" y="158.0" text-anchor="middle">辅助观测 z</text><text class="box" x="855.0" y="184.0" text-anchor="middle">轮速 / NHC / 外部</text><polyline class="arrow" points="275,165 390,165"/><rect x="390" y="300" width="240" height="110" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="510.0" y="335.0" text-anchor="middle">创新 r=z−h(x̂⁻)</text><text class="box" x="510.0" y="361.0" text-anchor="middle">时间 / 质量 / NIS</text><text class="box" x="510.0" y="387.0" text-anchor="middle">接受或拒绝</text><polyline class="arrow" points="510,220 510,300"/><polyline class="arrow" points="965,165 985,165 985,355 630,355"/><rect x="35" y="480" width="260" height="105" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="165.0" y="525.5" text-anchor="middle">接受：K、δx与P更新</text><text class="box" x="165.0" y="551.5" text-anchor="middle">状态注入 / 误差重置</text><rect x="365" y="480" width="290" height="105" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="510.0" y="525.5" text-anchor="middle">bias反馈到测量</text><text class="box" x="510.0" y="551.5" text-anchor="middle">姿态、速度、位置修正</text><rect x="745" y="480" width="220" height="105" rx="9" fill="#eaf3f7" stroke="#97b6c5"/><text class="box" x="855.0" y="525.5" text-anchor="middle">拒绝：保持预测</text><text class="box" x="855.0" y="551.5" text-anchor="middle">P增长 / 降级监督</text><polyline class="arrow" points="440,410 440,445 165,445 165,480"/><polyline class="arrow" points="580,410 580,445 855,445 855,480"/><polyline class="arrow" points="295,533 365,533"/><polyline class="arrow" points="510,585 510,607 15,607 15,165 35,165"/><text class="note" x="167" y="286" text-anchor="middle">bias反馈不是实车位移</text><text class="note" x="840" y="286" text-anchor="middle">不应重复融合同源信息</text></svg>