# Phase B: SPI2RST peripheral-reset simulation.
# Halt CPU, pulse RCC APB1LRSTR SPI2RST(bit14), restore SPI2 regs to firmware config,
# resume, then observe whether the OVR death loop heals (errors stop, completed grows).
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init

proc dumpregs {tag} {
    echo "$tag CR1 [stm32h7x.cpu0 read_memory 0x40003800 32 1] CR2 [stm32h7x.cpu0 read_memory 0x40003804 32 1] CFG1 [stm32h7x.cpu0 read_memory 0x40003808 32 1] CFG2 [stm32h7x.cpu0 read_memory 0x4000380c 32 1] IER [stm32h7x.cpu0 read_memory 0x40003810 32 1] SR [stm32h7x.cpu0 read_memory 0x40003814 32 1] HSTATE [stm32h7x.cpu0 read_memory 0x24000475 8 1] HERR [stm32h7x.cpu0 read_memory 0x24000478 32 1]"
}

halt
sleep 200
dumpregs "BEFORE"

# Pulse SPI2RST (RCC_APB1LRSTR @0x58024490, bit14)
stm32h7x.cpu0 write_memory 0x58024490 32 0x4000
sleep 10
stm32h7x.cpu0 write_memory 0x58024490 32 0x0
sleep 10
dumpregs "AFTERRST"

# Restore firmware SPI2 config (SPE=0 after reset, so CFG writes are legal)
stm32h7x.cpu0 write_memory 0x40003808 32 0x70070007
stm32h7x.cpu0 write_memory 0x4000380c 32 0x44400000
stm32h7x.cpu0 write_memory 0x40003804 32 0x400
stm32h7x.cpu0 write_memory 0x40003810 32 0x0
stm32h7x.cpu0 write_memory 0x40003818 32 0x9f8
stm32h7x.cpu0 write_memory 0x40003800 32 0x1000
dumpregs "RESTORED"

resume
sleep 500

# Observe 60s: does the death loop stop?
for {set i 0} {$i < 12} {incr i} {
    echo "P$i ST [stm32h7x.cpu0 read_memory 0x24034924 32 6] SR [stm32h7x.cpu0 read_memory 0x40003814 32 1] TXNDTR [stm32h7x.cpu0 read_memory 0x4002002c 32 1] RXNDTR [stm32h7x.cpu0 read_memory 0x40020044 32 1] LISR [stm32h7x.cpu0 read_memory 0x40020000 32 1] HERR [stm32h7x.cpu0 read_memory 0x24000478 32 1]"
    sleep 5000
}
shutdown
