# Phase A: passive observe. Confirm OVR death loop still active before experimenting.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
# s_status(6w) @0x24034924  hspi2 State byte @0x24000475  ErrorCode @0x24000478
# SPI2 SR @0x40003814  DMA TX NDTR @0x4002002c  RX NDTR @0x40020044  LISR @0x40020000
for {set i 0} {$i < 6} {incr i} {
    echo "S$i ST [stm32h7x.cpu0 read_memory 0x24034924 32 6] HSTATE [stm32h7x.cpu0 read_memory 0x24000475 8 1] HERR [stm32h7x.cpu0 read_memory 0x24000478 32 1] SR [stm32h7x.cpu0 read_memory 0x40003814 32 1] TXNDTR [stm32h7x.cpu0 read_memory 0x4002002c 32 1] RXNDTR [stm32h7x.cpu0 read_memory 0x40020044 32 1] LISR [stm32h7x.cpu0 read_memory 0x40020000 32 1]"
    sleep 2000
}
shutdown
