# Fix CFG2 MASTER bit, verify readback, then resume and observe completed counter.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
halt
sleep 200
echo "CR1now [stm32h7x.cpu0 read_memory 0x40003800 32 1] CFG2now [stm32h7x.cpu0 read_memory 0x4000380c 32 1]"
stm32h7x.cpu0 write_memory 0x4000380c 32 0x44400000
sleep 5
echo "CFG2rb1 [stm32h7x.cpu0 read_memory 0x4000380c 32 1]"
stm32h7x.cpu0 write_memory 0x4000380c 32 0x44400000
sleep 5
echo "CFG2rb2 [stm32h7x.cpu0 read_memory 0x4000380c 32 1]"
stm32h7x.cpu0 write_memory 0x40003818 32 0x9f8
resume
sleep 500
for {set i 0} {$i < 12} {incr i} {
    echo "Q$i ST [stm32h7x.cpu0 read_memory 0x24034924 32 6] SR [stm32h7x.cpu0 read_memory 0x40003814 32 1] CFG2 [stm32h7x.cpu0 read_memory 0x4000380c 32 1] CR1 [stm32h7x.cpu0 read_memory 0x40003800 32 1] TXNDTR [stm32h7x.cpu0 read_memory 0x4002002c 32 1] RXNDTR [stm32h7x.cpu0 read_memory 0x40020044 32 1]"
    sleep 5000
}
shutdown
