# R4-V07: 10-minute passive observation of the R4 firmware under the recurring OVR trigger.
# Addresses from SmartCar.map of HEX af7b5c60... (R4 build):
# s_status @0x2403492c, s_consecutive_errors @0x240001f8, s_reinit_count @0x240001fc.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
for {set i 0} {$i < 120} {incr i} {
    echo "T$i ST [stm32h7x.cpu0 read_memory 0x2403492c 32 6] CONSEC [stm32h7x.cpu0 read_memory 0x240001f8 32 1] REINIT [stm32h7x.cpu0 read_memory 0x240001fc 32 1] SR [stm32h7x.cpu0 read_memory 0x40003814 32 1] TXNDTR [stm32h7x.cpu0 read_memory 0x4002002c 32 1] RXNDTR [stm32h7x.cpu0 read_memory 0x40020044 32 1]"
    sleep 5000
}
shutdown
