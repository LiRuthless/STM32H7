# 7.5MHz high-speed gear test: patch CFG1 MBR + hspi2.Init.BaudRatePrescaler in RAM,
# resume, observe 60s, then revert to 1.875MHz and observe 30s.
# hspi2 @0x240003fc, Init.BaudRatePrescaler at +28 = 0x24000418.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init

halt
sleep 100
echo "PRE CR1 [stm32h7x.cpu0 read_memory 0x40003800 32 1] CFG1 [stm32h7x.cpu0 read_memory 0x40003808 32 1] RAMPSC [stm32h7x.cpu0 read_memory 0x24000418 32 1]"
# 停 SPI，切分频到 /64（7.5MHz），同步改 RAM 中的 Init 使 R4 重初始化保持同档
stm32h7x.cpu0 write_memory 0x40003800 32 0x1000
stm32h7x.cpu0 write_memory 0x40003808 32 0x50070007
stm32h7x.cpu0 write_memory 0x24000418 32 0x50000000
echo "FAST CR1 [stm32h7x.cpu0 read_memory 0x40003800 32 1] CFG1 [stm32h7x.cpu0 read_memory 0x40003808 32 1] RAMPSC [stm32h7x.cpu0 read_memory 0x24000418 32 1]"
resume
sleep 500
for {set i 0} {$i < 12} {incr i} {
    echo "F$i ST [stm32h7x.cpu0 read_memory 0x2403492c 32 6] REINIT [stm32h7x.cpu0 read_memory 0x240001fc 32 1] CFG1 [stm32h7x.cpu0 read_memory 0x40003808 32 1]"
    sleep 5000
}

# 恢复低速档
halt
sleep 100
stm32h7x.cpu0 write_memory 0x40003800 32 0x1000
stm32h7x.cpu0 write_memory 0x40003808 32 0x70070007
stm32h7x.cpu0 write_memory 0x24000418 32 0x70000000
echo "SLOW CR1 [stm32h7x.cpu0 read_memory 0x40003800 32 1] CFG1 [stm32h7x.cpu0 read_memory 0x40003808 32 1] RAMPSC [stm32h7x.cpu0 read_memory 0x24000418 32 1]"
resume
sleep 500
for {set i 0} {$i < 6} {incr i} {
    echo "S$i ST [stm32h7x.cpu0 read_memory 0x2403492c 32 6] REINIT [stm32h7x.cpu0 read_memory 0x240001fc 32 1] CFG1 [stm32h7x.cpu0 read_memory 0x40003808 32 1]"
    sleep 5000
}
shutdown
