source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo "HSPI2 [stm32h7x.cpu0 read_memory 0x240003f4 32 34]"
echo "HDMATX [stm32h7x.cpu0 read_memory 0x2400047c 32 30]"
echo "HDMARX [stm32h7x.cpu0 read_memory 0x240004f4 32 30]"
shutdown
