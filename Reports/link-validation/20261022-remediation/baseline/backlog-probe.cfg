# Passive attach: no halt/reset/write. Reuses the verified stock scripts.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
# Sample loop: s_status(6w) @0x24034924, s_link(6w) @0x24008f28, GPIOA_IDR @0x58020010
for {set i 0} {$i < 200} {incr i} {
    echo "S $i WIFI [stm32h7x.cpu0 read_memory 0x24034924 32 6] LINK [stm32h7x.cpu0 read_memory 0x24008f28 32 6] GPIOA_IDR [stm32h7x.cpu0 read_memory 0x58020010 32 1]"
    sleep 10
}
echo [stm32h7x.cpu0 curstate]
shutdown
