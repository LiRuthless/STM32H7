source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo "SPI2 [stm32h7x.cpu0 read_memory 0x40003800 32 8]"
echo "DMA1_L [stm32h7x.cpu0 read_memory 0x40020000 32 3]"
echo "DMA1_S1 [stm32h7x.cpu0 read_memory 0x40020028 32 6]"
echo "DMA1_S2 [stm32h7x.cpu0 read_memory 0x40020040 32 6]"
echo "HSPI2_STATE [stm32h7x.cpu0 read_memory 0x24000474 32 2]"
echo "HDMATX_ERR [stm32h7x.cpu0 read_memory 0x240004d0 32 2]"
echo "HDMARX_ERR [stm32h7x.cpu0 read_memory 0x24000548 32 2]"
echo "WIFI [stm32h7x.cpu0 read_memory 0x24034924 32 6]"
echo [stm32h7x.cpu0 curstate]
shutdown
