source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo "TICK1 [stm32h7x.cpu0 read_memory 0x24000008 32 1]"
echo "FAULT [stm32h7x.cpu0 read_memory 0xe000ed28 32 2]"
sleep 300
echo "TICK2 [stm32h7x.cpu0 read_memory 0x24000008 32 1]"
echo [stm32h7x.cpu0 curstate]
shutdown
