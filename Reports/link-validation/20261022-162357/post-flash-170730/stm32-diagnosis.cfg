# Passive attach: no halt/reset/write to application/peripheral memory.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
# Override stock examine hook, which would modify DBGMCU and watchdog freeze.
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo [targets]; echo [stm32h7x.cpu0 curstate]
dump_image {D:/STM32H7/Reports/link-validation/20261022-162357/post-flash-170730/stm32-flash-readback.bin} 0x08000000 79040
echo "APP [stm32h7x.cpu0 read_memory 0x24000084 8 5]"
echo "TICK_RESET [stm32h7x.cpu0 read_memory 0x24000008 32 1] [stm32h7x.cpu0 read_memory 0x580244d0 32 1]"
echo "CLOCKS [stm32h7x.cpu0 read_memory 0x58024410 32 10]"
for {set i 0} {$i < 100} {incr i} {
    echo "SAMPLE $i WIFI [stm32h7x.cpu0 read_memory 0x24034924 32 6] SPI [stm32h7x.cpu0 read_memory 0x40003800 32 6] DMA [stm32h7x.cpu0 read_memory 0x40020028 32 12] HSTATE [stm32h7x.cpu0 read_memory 0x24000474 32 2] DMAERR [stm32h7x.cpu0 read_memory 0x240004d0 32 1] [stm32h7x.cpu0 read_memory 0x24000548 32 1] LINK [stm32h7x.cpu0 read_memory 0x24008f28 32 6]"
    sleep 10
}
echo "TX [stm32h7x.cpu0 read_memory 0x2407f000 32 16]"
echo "RX [stm32h7x.cpu0 read_memory 0x2407f400 32 16]"
echo [stm32h7x.cpu0 curstate]
shutdown
