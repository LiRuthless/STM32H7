# Passive attach: no halt/reset/write to application/peripheral memory.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
# Override stock examine hook, which would modify DBGMCU and watchdog freeze.
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo [targets]; echo [stm32h7x.cpu0 curstate]
echo "TICK [stm32h7x.cpu0 read_memory 0x24000008 32 1]"
echo "APP_KEY_START_RUN_STOPPENDING_REASON [stm32h7x.cpu0 read_memory 0x24000084 8 5]"
echo "RCC_RESET_FLAGS [stm32h7x.cpu0 read_memory 0x580244d0 32 1]"
echo "SCB_LINK [stm32h7x.cpu0 read_memory 0x24008f28 32 6]"
echo "WIFI [stm32h7x.cpu0 read_memory 0x24034924 32 6]"
echo "TX_HEADER [stm32h7x.cpu0 read_memory 0x2407f000 32 8]"
echo "RX_HEADER [stm32h7x.cpu0 read_memory 0x2407f400 32 8]"
sleep 100
echo "TICK_AFTER [stm32h7x.cpu0 read_memory 0x24000008 32 1]"
echo [stm32h7x.cpu0 curstate]
shutdown
