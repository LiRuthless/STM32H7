# Passive attach: no halt/reset/write to application/peripheral memory.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
# Override stock examine hook, which would modify DBGMCU and watchdog freeze.
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo [targets]; echo [stm32h7x.cpu0 curstate]
dump_image {D:/STM32H7/Reports/link-validation/20261020-230648/stm32-flash-readback.bin} 0x08000000 78948
echo SNAPSHOT_A
echo [mdw 0x24034924 6]
echo [mdw 0x40003800 6]
echo [mdw 0x40020000 24]
echo [mdw 0x58020000 10]
echo [mdw 0x58020400 10]
echo [mdw 0x58020c00 10]
echo [mdw 0x58024400 32]
echo [mdw 0x240003f4 94]
echo SNAPSHOT_B
echo [mdw 0x24034924 6]
echo [mdw 0x40003800 6]
echo [mdw 0x40020000 24]
echo [mdw 0x2407f000 8]
echo [mdw 0x2407f400 8]
echo [targets]; echo [stm32h7x.cpu0 curstate]
shutdown
