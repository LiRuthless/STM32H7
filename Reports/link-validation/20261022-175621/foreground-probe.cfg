source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
stm32h7x.cpu0 configure -event examine-end {}
reset_config none
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
for {set i 0} {$i < 20} {incr i} {
    echo "T $i TICK [stm32h7x.cpu0 read_memory 0x24000008 32 1] APP [stm32h7x.cpu0 read_memory 0x24000084 8 5] WIFI [stm32h7x.cpu0 read_memory 0x24034924 32 6] NVIC_ACTIVE [stm32h7x.cpu0 read_memory 0xe000e300 32 8]"
    sleep 100
}
echo [stm32h7x.cpu0 curstate]
shutdown
